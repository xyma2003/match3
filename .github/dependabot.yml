version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      framework:
        patterns:
          - next
          - "@next/eslint-plugin-next"
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      linting:
        patterns:
          - "@eslint/js"
          - eslint
          - "eslint-plugin-*"
          - typescript-eslint
      styling:
        patterns:
          - "@tailwindcss/postcss"
          - tailwindcss
      typescript:
        patterns:
          - typescript
          - "@types/node"
    ignore:
      # Keep automated updates inside the versions supported by the current
      # Next.js/ESLint toolchain and the Node.js 22 production runtime.
      - dependency-name: eslint
        versions:
          - ">=10"
      - dependency-name: "@eslint/js"
        versions:
          - ">=10"
      - dependency-name: typescript
        versions:
          - ">=6"
      - dependency-name: "@types/node"
        versions:
          - ">=23"
      - dependency-name: globals
        versions:
          - ">=17"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
